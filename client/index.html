<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONST API Local</title>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #f6f8fb;
        color: #162032;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-shell {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        min-height: 100%;
        background: #f6f8fb;
      }

      .boot-sidebar {
        border-right: 1px solid #dbe3ee;
        background: #ffffff;
        padding: 26px 20px;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #111827;
        font-size: 17px;
        font-weight: 800;
      }

      .boot-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 11px;
        background: #1557ff;
        color: #ffffff;
        font-weight: 900;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.18);
      }

      .boot-content {
        padding: 48px 56px;
      }

      .boot-title {
        margin: 0 0 10px;
        font-size: 28px;
        font-weight: 850;
      }

      .boot-muted {
        margin: 0;
        color: #66758a;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <aside class="boot-sidebar">
          <div class="boot-brand">
            <span class="boot-logo">C</span>
            <span>CONST API</span>
          </div>
        </aside>
        <main class="boot-content">
          <h1 class="boot-title">CONST API</h1>
          <p class="boot-muted">启动客户端</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
