[package]
name = "const-api-local"
version = "0.1.58"
description = "CONST API local-only source build"
license = "MIT"
edition = "2024"

[features]
# Raw request/response logging may contain prompts, credentials, and model output.
# Requiring an explicit compile-time feature keeps an environment variable alone
# from turning a normal development or release build into a plaintext recorder.
dangerous-raw-traffic-debug = []
# Opt-in allocation counters and authenticated local snapshots; excluded from release builds.
memory-diagnostics = ["windows-sys/Win32_System_ProcessStatus"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow = "1"
aes = "0.8"
cbc = "0.1"
async-trait = "0.1"
bytes = "1"
dirs = "6"
os_info = "3"
reqwest = { version = "0.13", features = ["brotli", "deflate", "form", "gzip", "http3", "json", "stream", "zstd"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
semver = "1"
time = { version = "0.3", features = ["local-offset", "parsing"] }
tauri = { version = "2.11", features = ["image-png", "tray-icon"] }
toml_edit = { version = "0.25", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
h3 = "0.0.8"
http = "1"
hyper-util = { version = "0.1.20", features = ["client-proxy", "client-proxy-system"] }
if-addrs = "0.15"
multer = "3.1"
http-body = "1"
http-body-util = "0.1"
log = "0.4"
flexi_logger = { version = "0.31", default-features = false, features = ["async"] }
json5 = "1.3"
warp = { version = "0.4", features = ["server", "test", "websocket"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
ed25519-dalek = "3"
base64 = "0.23"
rand = "0.10"
tempfile = "3"
quinn = { version = "0.11.11", default-features = false, features = ["ring", "runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.9"
zstd = "0.13.3"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_urlencoded = "0.7"
urlencoding = "2"
fs2 = "0.4"
tauri-plugin-os = "2"
sys-locale = "0.3.2"
x509-parser = "0.18"
rtc = "0.20"
webrtc = "0.20"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Storage_Packaging_Appx",
    "Wdk_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
plist = "1.10"
security-framework-sys = "2.17"
security-framework = "3.7"
tempfile = "3"

[dev-dependencies]
h3-quinn = "0.0.10"
proptest = "1"
rcgen = "0.14"
tempfile = "3"
